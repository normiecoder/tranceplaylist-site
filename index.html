<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trippy Toe Trance 🌊 — Live Playlist</title>
  <meta name="description" content="Dive into Trippy Toe Trance — a curated trance playlist. Listen live with others.">
  <meta property="og:title" content="Trippy Toe Trance 🌊">
  <meta property="og:description" content="A curated trance playlist. Listen live with others.">
  <meta property="og:type" content="music.playlist">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Bar Badges -->
  <div class="top-bar-left">
    <!-- Live Clock Pill -->
    <div class="top-badge clock-badge" id="clock-badge">
      <span class="clock-badge__time" id="clock-time">12:00:00</span>
      <span class="clock-badge__ampm" id="clock-ampm">AM</span>
    </div>

    <!-- Online Counter Pill -->
    <div class="top-badge online-counter" id="online-counter">
      <span class="online-counter__dot"></span>
      <span class="online-counter__number" id="online-count">--</span>
      <span>people vibing</span>
    </div>
  </div>



  <!-- Hero section -->
  <section class="hero" id="hero">
    <div class="hero__bg">
      <video class="hero__bg-video" id="hero-bg-video" autoplay loop muted playsinline poster="assets/space-bg-poster.webp">
        <source src="assets/space-bg-web.mp4" type="video/mp4">
      </video>
    </div>
    <div class="hero__overlay"></div>
    <div class="hero__content"></div>
  </section>

  <!-- Glassmorphic player -->
  <div class="player" id="player">
    <!-- Thumbnail -->
    <div class="player__thumb-wrap" id="player-thumb-wrap">
      <div class="player__thumb-placeholder" id="player-thumb-placeholder">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <img class="player__thumb" id="player-thumb" src="" alt="" style="display:none;">
    </div>

    <!-- Track info + progress -->
    <div class="player__info">
      <span class="player__track-name" id="player-track-name">Select a track</span>
      <span class="player__track-artist" id="player-track-artist">Trippy Toe Trance</span>
      <div class="player__progress-wrap">
        <span class="player__time" id="player-time-current">0:00</span>
        <div class="player__progress-bar" id="player-progress-bar">
          <div class="player__progress-fill" id="player-progress-fill"></div>
        </div>
        <span class="player__time" id="player-time-total">0:00</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="player__controls">
      <button class="player__btn player__btn--shuffle" id="btn-shuffle" aria-label="Shuffle" title="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="player__btn player__btn--prev" id="btn-prev" aria-label="Previous track" title="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="player__btn player__btn--play" id="btn-play" aria-label="Play" title="Play">
        <svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="player__btn player__btn--next" id="btn-next" aria-label="Next track" title="Next">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      
      <!-- Volume Control with Hover Popup Slider -->
      <div class="player__volume-wrap" id="volume-wrap">
        <div class="player__volume-popup" id="volume-popup">
          <input type="range" class="player__volume-slider" id="volume-slider" min="0" max="100" value="100" aria-label="Volume">
        </div>
        <button class="player__btn player__btn--volume" id="btn-volume" aria-label="Volume" title="Volume">
          <svg viewBox="0 0 24 24" id="volume-icon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Credits -->
  <a class="credits" href="https://instagram.com/aguycalledsurya" target="_blank" rel="noopener noreferrer" id="credits-link">
    Built with <span class="credits__heart">❤️</span> by @aguycalledsurya
    <svg class="credits__ig-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
  </a>

  <!-- Hidden YouTube player -->
  <div id="yt-player-container">
    <div id="yt-player"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
